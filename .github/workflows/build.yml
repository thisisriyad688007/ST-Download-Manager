name: Build Desktop App EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Build App (EXE)
      run: npm run build
      # যদি প্রজেক্টের package.json-এ বিল্ড কমান্ড অন্য কিছু হয় (যেমন npm run dist), তবে সেটি এখানে বসাবেন।