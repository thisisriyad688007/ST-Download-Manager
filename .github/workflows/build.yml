name: Build Desktop Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Desktop Dependencies & Build
      run: |
        if (Test-Path "desktop") {
          cd desktop
          npm install
          npm run build
        } else {
          npm run dist
        }

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ST-Download-Manager-Installer
        path: |
          desktop/dist/*.exe
          dist/*.exe
          build/*.exe
